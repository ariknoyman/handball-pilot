name: Sync from official site

on:
  schedule:
    - cron: '17 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: handball-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync data from handballisr.co.il
        id: sync
        run: python3 scripts/sync.py --ci

      - name: Verify build with synced data
        if: steps.sync.outputs.changed == 'true'
        run: |
          npm ci
          npm run build

      - name: Commit and push synced data
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "handball-sync-bot"
          git config user.email "handball-sync-bot@users.noreply.github.com"
          git add src/sync-data.json
          git commit -m "Auto-sync from official association site: ${{ steps.sync.outputs.summary }}"
          git push
